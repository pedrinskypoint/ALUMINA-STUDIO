[project]
name = "alumina-studio"
version = "0.14.4.3"
description = "Laboratorio y taller cerámico ALUMINA STUDIO"
requires-python = ">=3.11"
dependencies = [
  "gradio==6.5.1",
  "numpy==2.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "F405"]
